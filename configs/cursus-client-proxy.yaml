# cursus-client — TalariaTCP / 本地代理模式（无需 root，无需 TUN）
# 用法: cursus -role client -config cursus-client-proxy.yaml
#
# 局域网设备把 HTTP / SOCKS5 代理指向本机 IP:8080 / :1080 即可经服务端出网，
# 不需要改默认网关，也不需要每台设备装客户端。
mode: client
identity: vpn.example.com
wire_secret: "CHANGE-ME-DEPLOYMENT-WIRE-SECRET-32-BYTES"
protocol: TalariaTCP

server:
  listen_host: 127.0.0.1
  udp_port: 443
  tcp_port: 443
  cert_file: ""
  key_file: ""
  auth:
    client_id: cursus-demo
    secret_key: "cursus-demo-secret-change-me"
    assigned_client_id: 1
    version: 1
  allow_private: false
  virtual_prefix: 10.78.0.0/24
  virtual_base: 10.78.0.2
  wan_interface: eth0
  manage_routing: false

client:
  server_ip: 203.0.113.1
  server_port: 443            # TalariaTCP / TCP 443
  client_id: cursus-demo
  secret_key: "cursus-demo-secret-change-me"
  entrance_ip: 10.78.0.1
  exit_ip: 10.78.0.2
  routes:
    - 1.1.1.1/32
  proxy:
    enabled: true
    listen_host: 0.0.0.0
    socks5_port: 1080
    http_port: 8080

tun:
  mode: echo
  server_name: cursus-t0
  client_name: cursus-t0
  mtu: 1314
  echo_target: 1.1.1.1
  echo_payload: cursus
  probe_seconds: 2

log:
  verbose: false
